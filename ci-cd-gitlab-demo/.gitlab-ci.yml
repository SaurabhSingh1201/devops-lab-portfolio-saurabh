stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2

build:
  stage: build
  script:
    - echo "Building Docker Image"
    - docker build -t myapp .

test:
  stage: test
  script:
    - echo "Running Tests"
    - pytest

deploy:
  stage: deploy
  script:
    - echo "Deploying to Server"
    - ./deploy.sh